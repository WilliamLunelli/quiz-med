name: quiz-dpp

services:
  db:
    image: postgres:16-alpine
    container_name: quiz-dpp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quiz_dpp
    ports:
      # host 5433 -> container 5432 (5432 do host já é usado pelo PostgreSQL local)
      - "5433:5432"
    volumes:
      - quiz_dpp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quiz_dpp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quiz_dpp_data:
